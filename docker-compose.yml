services:
  zookeeper:
    image: zookeeper:latest
    container_name: raffle-zookeeper
    ports:
      - "2181:2181"
    networks:
      - raffle-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: raffle-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092,CONTROLLER://kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - raffle-net
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: raffle-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - raffle-net
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: raffle-redis
    command:
      - redis-server
      - --requirepass
      - "Devora!123"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - raffle-net
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: raffle-server
    ports:
      - "5072:80"
    depends_on:
      - redis
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=RaffleDb;User Id=sa;Password=Devora123!;TrustServerCertificate=True"
      Redis__Configuration: "redis:6379,password=Devora!123"
      Cache__GiftCacheTtlSeconds: 300
    networks:
      - raffle-net
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: raffle-client
    ports:
      - "4200:80"
    depends_on:
      - server
    networks:
      - raffle-net
    restart: unless-stopped

volumes:
  redisdata:
    name: raffle-redis-data

networks:
  raffle-net:
    driver: bridge
